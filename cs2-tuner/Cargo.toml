[package]
name = "cs2-tuner-prototype"
version = "0.1.0"
edition = "2024"
description = "Protótipo seguro de interface e regras de estado para ajustes de CS2 no Windows"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
